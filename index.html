<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ledgr — Personal Bill Tracker</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body class="bg-[#0A0A0A] text-text-primary">
  <div class="mobile-shell-frame overflow-hidden">
    <!-- View Container (dynamic SPA content) -->
    <main id="app-view" class="flex-1 overflow-y-auto pb-24 px-4 pt-4"></main>

    <!-- Bottom Navigation Bar Slot -->
    <nav id="app-nav" class="fixed bottom-0 left-0 right-0 max-w-[440px] mx-auto bg-surface/90 backdrop-blur-md border-t border-surface-alt/60 px-6 py-3 flex items-center justify-around z-40"></nav>

    <!-- Modal / Sheet Container -->
    <div id="modal-container" class="relative z-50"></div>
  </div>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
